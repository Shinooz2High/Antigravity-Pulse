name: Build Antigravity Pulse Mobile (Android & iOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Web Assets
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Prepare Gradle Wrapper & Android SDK Licenses
        working-directory: frontend/android
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Build Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-assets
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk release-assets/Antigravity-Pulse-Android.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Antigravity-Pulse-Android-Debug
          path: release-assets/Antigravity-Pulse-Android.apk
          retention-days: 30

      - name: Publish Latest APK to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Antigravity Pulse (Latest Build)
          body: |
            Bản build tự động mới nhất của **Antigravity Pulse** cho điện thoại Android.
            Xem hướng dẫn cài đặt chi tiết tại thư mục [`install/`](https://github.com/Shinooz2High/App-Antigravity-on-moblie-/tree/main/install).
          files: |
            release-assets/Antigravity-Pulse-Android.apk
            frontend/public/cai-antigravity-pulse.bat
            frontend/public/cai-antigravity-pulse.command
          make_latest: true

  build-ios:
    name: Build iOS Project & Unsigned IPA (Xcode)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Web Assets
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor iOS
        working-directory: frontend
        run: npx cap copy ios

      - name: Build iOS App Bundle (Unsigned) & Package IPA
        working-directory: frontend/ios/App
        continue-on-error: true
        run: |
          mkdir -p build/DerivedData
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          APP_BUNDLE="$(find build/DerivedData -name "App.app" -type d | head -n1)"
          if [ -n "$APP_BUNDLE" ]; then
            mkdir -p ../../../release-assets/Payload
            cp -R "$APP_BUNDLE" ../../../release-assets/Payload/
            (cd ../../../release-assets && zip -qr Antigravity-Pulse-iOS.ipa Payload && rm -rf Payload)
          fi

      - name: Build iOS Simulator Verification
        working-directory: frontend/ios/App
        continue-on-error: true
        run: |
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS Simulator' \
            clean build CODE_SIGNING_ALLOWED=NO

      - name: Zip iOS Xcode Project
        run: |
          mkdir -p release-assets
          zip -qr release-assets/Antigravity-Pulse-iOS-Project.zip frontend/ios

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Antigravity-Pulse-iOS-Package
          path: release-assets/
          retention-days: 30

      - name: Publish iOS Assets to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Antigravity Pulse (Latest Build)
          files: |
            release-assets/*
          make_latest: true
